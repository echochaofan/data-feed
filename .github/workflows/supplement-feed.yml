name: Supplement Feed

on:
  schedule:
    # 每小时第 0 分钟（UTC）。GitHub 免费版可能有几分钟延迟，可接受。
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    # 代码改动推送到 main 就重建一次，省得手动点按钮
    branches: [main]

permissions:
  contents: write

concurrency:
  group: supplement-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate supplemental XML
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python merchant_feed/cloud_generate.py

      - name: Show output size
        run: ls -lh public/supplement_feed.xml

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "supplement feed ${{ github.run_id }}"
